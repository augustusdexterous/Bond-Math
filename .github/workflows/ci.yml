name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Command line on the sample curve and a bond
        run: |
          .venv/bin/bond-math curve examples/sample_par_curve.csv > /dev/null
          .venv/bin/bond-math bond --coupon 0.05 --years 10 --price 95 --json > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint and format check
        run: |
          uvx ruff check .
          uvx ruff format --check .
