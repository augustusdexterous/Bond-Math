[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bond-math"
version = "0.1.0"
description = "Fixed-income analytics: bond price, yield, duration, convexity and DV01, and zero curves with forward rates from par yields."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "augustusdexterous" }]
keywords = ["bonds", "fixed income", "duration", "convexity", "DV01", "yield curve", "bootstrapping", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
bond-math = "bond_math.cli:main"

[tool.setuptools]
packages = ["bond_math"]

[tool.setuptools.package-data]
bond_math = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 110
